async function initCloudSync() {
  const docRef = window.docRef;
  try {
    const snap = await getDoc(docRef);
    if (snap.exists()) {
      db = C.validateDb(snap.data());
    } else {
      await setDoc(docRef, db);
    }
  } catch(e) {
    console.error("Erro ao carregar do Firestore:", e);
  }

  C.ensurePeriods(db);
  render();

  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      const remoteDb = C.validateDb(docSnap.data());
      if (remoteDb.savedAt > db.savedAt) {
        db = remoteDb;
        C.ensurePeriods(db);
        render();
        toast("Atualizado em tempo real!");
      }
    }
  });
}

async function saveCloud(msg='Salvo na nuvem com sucesso!') {
  db.savedAt = Date.now();
  C.ensurePeriods(db);
  try {
    await setDoc(window.docRef, db);
    render();
    toast(msg);
  } catch(e) {
    toast("Erro ao salvar na nuvem. Verifique a internet.");
  }
}

const staff = () => db.employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));

  const t = $('#toast');
  t.textContent = s; t.style.display = 'block';
  clearTimeout(timer);
  timer = setTimeout(()=> t.style.display='none', 4000);
}

  const pages = {overview:['Visão geral','home'],control:['Férias atuais','periods'],future:['Próximos períodos','clock'],calendar:['Calendário','calendar'],employees:['Funcionários','people']};
  const pending = db.periods.filter(p=>!p.openingConfirmed).length;
  
  $('#app').innerHTML = `
    <div class="shell">
      <aside class="sidebar">

}

}

function eventDialog() {
  openDialog('Lançar férias',`<form id="event-form" class="dialog-body"><div class="form-grid"><div class="field"><label>Funcionário</label><select name="employee" required><option value="">Selecione</option>${staff().map(x=>`<option value="${x.id}">${esc(display(x.name))}</option>`).join('')}</select></div><div class="field"><label>Início</label><input name="start" type="date" required></div><div class="field"><label>Fim</label><input name="end" type="date" required></div></div></form>`, `<div class="dialog-foot">${button('close','Voltar')}<button class="primary" form="event-form" type="submit">Salvar</button></div>`);
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-action]'); if(!b) return; const a = b.dataset.action;
  if(a==='nav'){ui.page=b.dataset.page;render();}
  if(a==='view'){ui.view=b.dataset.view;render();}
  if(a==='close')close();
  if(a==='period')periodDialog(b.dataset.id);
  if(a==='event')eventDialog();
});

document.addEventListener('submit', async ev => {
  ev.preventDefault(); const form = ev.target, f = new FormData(form);
  if(form.id==='period-form'){
    const p = db.periods.find(x=>x.id===form.dataset.id);
    p.entitlement = Number(f.get('entitlement'));
    p.abono = Number(f.get('abono'));
    p.notes = f.get('notes').trim();
    p.openingConfirmed = f.has('openingConfirmed');
    close();
    await saveCloud('Período atualizado e sincronizado!');
  }
  if(form.id==='event-form'){
    const empId = f.get('employee'), start = f.get('start'), end = f.get('end');
    const p = db.periods.find(x=>x.employeeId===empId);
    if(p) {
      db.events.push({id: uid('v'), periodId: p.id, start, end, state:'planejada', notice:'', payment:'', notes:''});
      close();
      await saveCloud('Férias lançadas na nuvem!');
    }
  }
});

initCloudSync();
})();
</script>
</body>
</html>
